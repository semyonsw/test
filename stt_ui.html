<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call Transcriber — Armenian ASR</title>
<style>
  :root {
    --bg: #f4f6f9;  --panel: #ffffff;   --panel-2: #fafbfd;
    --line: #e3e7ee; --line-2: #eef1f6;
    --ink: #171a21;  --ink-2: #5b6472;  --ink-3: #8b95a5;
    --accent: #4f46e5; --accent-ink: #ffffff; --accent-soft: #ecebfd;
    --ok: #0f9d6b;   --ok-soft: #e5f6ef;
    --warn: #b8710c; --warn-soft: #fdf3e2;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 16px rgba(16,24,40,.05);
    --r: 10px;
    --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    --font-hy: "Segoe UI", "Noto Sans Armenian", Sylfaen, system-ui, sans-serif;
    --mono: "Cascadia Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1014;  --panel: #16191f;  --panel-2: #1b1f27;
      --line: #262b34; --line-2: #21252d;
      --ink: #e7eaef; --ink-2: #a3adbd;  --ink-3: #737e8f;
      --accent: #8b85f7; --accent-ink: #14121f; --accent-soft: #232043;
      --ok: #34d399;  --ok-soft: #14312a;
      --warn: #e0a341; --warn-soft: #33260f;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="light"] {
    --bg: #f4f6f9;  --panel: #ffffff;   --panel-2: #fafbfd;
    --line: #e3e7ee; --line-2: #eef1f6;
    --ink: #171a21;  --ink-2: #5b6472;  --ink-3: #8b95a5;
    --accent: #4f46e5; --accent-ink: #ffffff; --accent-soft: #ecebfd;
    --ok: #0f9d6b;  --ok-soft: #e5f6ef;
    --warn: #b8710c; --warn-soft: #fdf3e2;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 16px rgba(16,24,40,.05);
  }
  :root[data-theme="dark"] {
    --bg: #0e1014;  --panel: #16191f;  --panel-2: #1b1f27;
    --line: #262b34; --line-2: #21252d;
    --ink: #e7eaef; --ink-2: #a3adbd;  --ink-3: #737e8f;
    --accent: #8b85f7; --accent-ink: #14121f; --accent-soft: #232043;
    --ok: #34d399;  --ok-soft: #14312a;
    --warn: #e0a341; --warn-soft: #33260f;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- shell ---------- */
  .app { display: flex; flex-direction: column; height: 100vh; }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 0 16px; height: 56px; flex: 0 0 auto;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 650; letter-spacing: -.01em; }
  .brand svg { color: var(--accent); }
  .crumb {
    font-family: var(--mono); font-size: 12px; color: var(--ink-3);
    background: var(--panel-2); border: 1px solid var(--line);
    padding: 4px 9px; border-radius: 7px;
    max-width: 42vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .spacer { flex: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 550; padding: 4px 10px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-2);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); flex: 0 0 auto; }
  .pill.on { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
  .pill.on .dot { background: var(--ok); }
  .pill.busy { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
  .pill.busy .dot { background: var(--warn); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

  .icon-btn {
    display: grid; place-items: center; width: 32px; height: 32px;
    background: transparent; border: 1px solid var(--line); border-radius: 8px;
    color: var(--ink-2);
  }
  .icon-btn:hover { background: var(--panel-2); color: var(--ink); }

  main { flex: 1; display: flex; min-height: 0; }

  /* ---------- sidebar ---------- */
  aside {
    width: 316px; flex: 0 0 auto; display: flex; flex-direction: column;
    background: var(--panel); border-right: 1px solid var(--line); min-height: 0;
  }
  .search { padding: 12px; border-bottom: 1px solid var(--line-2); }
  .search input {
    width: 100%; padding: 8px 11px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel-2);
  }
  .search input::placeholder { color: var(--ink-3); }
  .list { overflow-y: auto; padding: 8px; flex: 1; }
  .rec {
    width: 100%; text-align: left; background: transparent; border: 1px solid transparent;
    border-radius: var(--r); padding: 9px 11px; margin-bottom: 3px; display: block;
    transition: background .12s, border-color .12s;
  }
  .rec:hover { background: var(--panel-2); }
  .rec.sel { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 28%, transparent); }
  .rec-name {
    font-weight: 560; font-size: 13px; margin-bottom: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .rec.sel .rec-name { color: var(--accent); }
  .rec-meta {
    display: flex; align-items: center; gap: 7px;
    font-size: 11.5px; color: var(--ink-3); font-family: var(--mono);
  }
  .tick { color: var(--ok); font-weight: 700; }
  .empty { padding: 28px 16px; text-align: center; color: var(--ink-3); font-size: 13px; }

  /* ---------- content ---------- */
  section.content { flex: 1; overflow-y: auto; min-width: 0; padding: 20px 24px 40px; }
  .placeholder {
    height: 100%; display: grid; place-content: center; justify-items: center;
    gap: 10px; color: var(--ink-3); text-align: center;
  }
  .placeholder svg { opacity: .5; }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: var(--shadow); padding: 18px 20px; margin-bottom: 16px;
  }
  h1 { font-size: 17px; margin: 0 0 5px; letter-spacing: -.015em; word-break: break-all; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-3); font-family: var(--mono); }

  /* timeline */
  .tl {
    position: relative; height: 46px; margin: 16px 0 10px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 8px; overflow: hidden; cursor: pointer;
  }
  .tl-span {
    position: absolute; top: 8px; bottom: 8px; border-radius: 3px;
    background: color-mix(in srgb, var(--accent) 42%, transparent);
  }
  .tl-head { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); pointer-events: none; }
  .tl-head::after {
    content: ""; position: absolute; top: -3px; left: -3px;
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  }
  .tl-hint { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11.5px; color: var(--ink-3); }

  .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .play {
    display: grid; place-items: center; width: 40px; height: 40px; flex: 0 0 auto;
    border: none; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
  }
  .play:hover { filter: brightness(1.08); }
  .time { font-family: var(--mono); font-size: 13px; color: var(--ink-2); }

  .seg-group { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg-group button {
    background: var(--panel-2); border: none; padding: 6px 12px; font-size: 12.5px;
    font-weight: 550; color: var(--ink-2); border-right: 1px solid var(--line);
  }
  .seg-group button:last-child { border-right: none; }
  .seg-group button.on { background: var(--accent); color: var(--accent-ink); }
  .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; }

  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 15px; border-radius: 8px; font-weight: 580; font-size: 13px;
    background: var(--accent); color: var(--accent-ink); border: none;
    text-decoration: none;  /* the export buttons are <a> */
  }
  .btn:hover:not(:disabled) { filter: brightness(1.08); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink-2); }
  .btn.ghost:hover { background: var(--panel-2); color: var(--ink); }

  .spin {
    width: 13px; height: 13px; border-radius: 50%; flex: 0 0 auto;
    border: 2px solid currentColor; border-top-color: transparent;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg) } }

  .stats { display: flex; flex-wrap: wrap; gap: 18px; padding-top: 14px; margin-top: 14px; border-top: 1px solid var(--line-2); }
  .stat-k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; }
  .stat-v { font-family: var(--mono); font-size: 15px; font-weight: 600; }

  /* transcript */
  .t-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
  .t-head h2 { font-size: 14px; margin: 0; }
  .t-head input {
    padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel-2); width: 180px; font-size: 13px;
  }
  .cues { display: flex; flex-direction: column; gap: 2px; }
  .cue {
    display: grid; grid-template-columns: 62px 1fr; gap: 12px; align-items: start;
    width: 100%; text-align: left; background: transparent; border: none;
    border-left: 2px solid transparent; border-radius: 0 8px 8px 0;
    padding: 9px 12px; transition: background .12s;
  }
  .cue:hover { background: var(--panel-2); }
  .cue.on { background: var(--accent-soft); border-left-color: var(--accent); }
  .cue-t { font-family: var(--mono); font-size: 12px; color: var(--ink-3); padding-top: 2px; }
  .cue.on .cue-t { color: var(--accent); font-weight: 600; }
  .cue-x { font-family: var(--font-hy); font-size: 15px; line-height: 1.62; }
  .cue mark { background: color-mix(in srgb, var(--warn) 30%, transparent); color: inherit; border-radius: 3px; }
  .cue.dim { opacity: .3; }

  .banner {
    padding: 11px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 14px;
    background: var(--warn-soft); color: var(--warn);
  }
  .note { font-size: 12px; color: var(--ink-3); margin-top: 14px; line-height: 1.6; }
  @media (max-width: 820px) {
    aside { width: 100%; position: absolute; z-index: 5; height: 100%; transform: translateX(-100%); transition: transform .2s; }
    aside.open { transform: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M12 2v20M6 7v10M18 7v10M2 11v2M22 11v2"/>
      </svg>
      Call Transcriber
    </div>
    <div class="crumb" id="crumb">…</div>
    <div class="spacer"></div>
    <div class="pill" id="modelPill"><span class="dot"></span><span id="modelTxt">model idle</span></div>
    <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>
      </svg>
    </button>
  </header>

  <main>
    <aside id="side">
      <div class="search">
        <input id="filter" type="search" placeholder="Filter recordings…" autocomplete="off">
      </div>
      <div class="list" id="list"><div class="empty">Loading…</div></div>
    </aside>

    <section class="content" id="content">
      <div class="placeholder">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
        <div>Pick a recording to get started</div>
      </div>
    </section>
  </main>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
const $ = (s, r = document) => r.querySelector(s);
const audio = $("#audio");

const S = {
  recs: [], sel: null, mode: "chunked", decoder: "rnnt",
  data: null, busy: false, find: "", cueEls: [], activeCue: -1,
};

/* ---------- theme ---------- */
const themeKey = "stt-theme";
// ?theme=light|dark forces a palette; otherwise remember the last choice,
// otherwise follow the OS.
const qsTheme = new URLSearchParams(location.search).get("theme");
if (qsTheme === "light" || qsTheme === "dark") document.documentElement.dataset.theme = qsTheme;
else if (localStorage.getItem(themeKey)) document.documentElement.dataset.theme = localStorage.getItem(themeKey);
$("#themeBtn").onclick = () => {
  const cur = document.documentElement.dataset.theme
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem(themeKey, next);
};

/* ---------- utils ---------- */
const clock = t => {
  if (t == null || isNaN(t)) return "–:–";
  t = Math.max(0, t);
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return `${m}:${String(s).padStart(2, "0")}`;
};
const kb = n => n > 1e6 ? (n / 1e6).toFixed(1) + " MB" : Math.round(n / 1e3) + " KB";
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const key = () => `${S.mode}_${S.decoder}`;

async function api(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) {
    let d = r.statusText;
    try { d = (await r.json()).detail || d; } catch {}
    throw new Error(d);
  }
  return r.json();
}

/* ---------- status ---------- */
async function pollStatus() {
  try {
    const s = await api("/api/status");
    $("#crumb").textContent = s.dir;
    $("#crumb").title = s.dir;
    const pill = $("#modelPill"), txt = $("#modelTxt");
    pill.className = "pill" + (s.busy ? " busy" : s.loaded ? " on" : "");
    txt.textContent = s.busy ? "transcribing…" : s.loading ? "loading model…"
      : s.loaded ? "model ready" : "model idle";
  } catch {}
}

/* ---------- sidebar ---------- */
async function loadRecordings() {
  try {
    S.recs = await api("/api/recordings");
  } catch (e) {
    $("#list").innerHTML = `<div class="empty">Could not list recordings<br>${esc(e.message)}</div>`;
    return;
  }
  renderList();
  // Deep link: /#<filename> opens straight to that recording.
  const want = decodeURIComponent(location.hash.slice(1));
  if (want && S.recs.some(r => r.name === want)) select(want);
}

function renderList() {
  const q = $("#filter").value.trim().toLowerCase();
  const hits = S.recs.filter(r => !q || r.name.toLowerCase().includes(q));
  const list = $("#list");
  if (!hits.length) {
    list.innerHTML = `<div class="empty">${S.recs.length ? "No match" : "No audio files in this folder"}</div>`;
    return;
  }
  list.innerHTML = "";
  for (const r of hits) {
    const b = document.createElement("button");
    b.className = "rec" + (S.sel === r.name ? " sel" : "");
    const done = r.transcripts.length
      ? `<span class="tick" title="${r.transcripts.join(", ")}">✓ ${r.transcripts.length}</span>` : "";
    b.innerHTML =
      `<div class="rec-name" title="${esc(r.name)}">${esc(r.name)}</div>
       <div class="rec-meta"><span>${clock(r.duration)}</span><span>·</span>
       <span>${r.sample_rate ? (r.sample_rate / 1000) + "k" : "?"}</span>
       <span>·</span><span>${kb(r.size)}</span>${done}</div>`;
    b.onclick = () => select(r.name);
    list.appendChild(b);
  }
}
$("#filter").oninput = renderList;

/* ---------- selection ---------- */
async function select(name) {
  S.sel = name; S.data = null; S.find = ""; S.activeCue = -1;
  location.hash = encodeURIComponent(name);
  renderList();
  audio.src = `/api/audio/${encodeURIComponent(name)}`;
  audio.load();
  render();
  await loadCached();
}

async function loadCached() {
  if (!S.sel) return;
  try {
    S.data = await api(`/api/transcript/${encodeURIComponent(S.sel)}?mode=${S.mode}&decoder=${S.decoder}`);
  } catch { S.data = null; }
  render();
}

/* ---------- transcribe ---------- */
async function transcribe(force = false) {
  if (!S.sel || S.busy) return;
  S.busy = true; render(); pollStatus();
  try {
    S.data = await api("/api/transcribe", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: S.sel, mode: S.mode, decoder: S.decoder, force }),
    });
    const r = S.recs.find(x => x.name === S.sel);
    if (r && !r.transcripts.includes(key())) { r.transcripts.push(key()); r.transcripts.sort(); }
  } catch (e) {
    alert("Transcription failed:\n\n" + e.message);
  } finally {
    S.busy = false; renderList(); render(); pollStatus();
  }
}

/* ---------- render ---------- */
function render() {
  const c = $("#content");
  if (!S.sel) return;
  const rec = S.recs.find(r => r.name === S.sel) || {};
  const dur = S.data?.duration ?? rec.duration ?? audio.duration;
  const d = S.data;

  c.innerHTML = `
    <div class="card">
      <h1>${esc(S.sel)}</h1>
      <div class="facts">
        <span>${clock(dur)}</span>
        <span>${rec.sample_rate ? rec.sample_rate + " Hz" : ""}</span>
        <span>${rec.channels ? (rec.channels === 1 ? "mono" : rec.channels + " ch") : ""}</span>
        <span>${rec.size ? kb(rec.size) : ""}</span>
      </div>

      <div class="tl" id="tl">
        ${d ? "" : '<div class="tl-hint">transcribe to see the speech / silence map</div>'}
        <div class="tl-head" id="head" style="left:0"></div>
      </div>

      <div class="controls">
        <button class="play" id="play" aria-label="Play or pause">${playIcon()}</button>
        <span class="time"><span id="cur">0:00</span> / ${clock(dur)}</span>
        <span class="spacer" style="flex:1"></span>
        <span class="lbl">Segmenting</span>
        <div class="seg-group" id="modeSeg">
          <button data-v="chunked" class="${S.mode === "chunked" ? "on" : ""}">Chunked</button>
          <button data-v="full" class="${S.mode === "full" ? "on" : ""}">Full&nbsp;file</button>
        </div>
        <span class="lbl">Decoder</span>
        <div class="seg-group" id="decSeg">
          <button data-v="rnnt" class="${S.decoder === "rnnt" ? "on" : ""}">RNNT</button>
          <button data-v="ctc" class="${S.decoder === "ctc" ? "on" : ""}">CTC</button>
        </div>
        <button class="btn" id="go" ${S.busy ? "disabled" : ""}>
          ${S.busy ? '<span class="spin"></span>Transcribing…'
            : d ? "Re-transcribe" : "Transcribe"}
        </button>
      </div>

      ${d ? `<div class="stats">
        <div><div class="stat-k">Words</div><div class="stat-v">${d.n_words}</div></div>
        <div><div class="stat-k">Cues</div><div class="stat-v">${d.segments.length}</div></div>
        <div><div class="stat-k">Compute</div><div class="stat-v">${d.seconds}s</div></div>
        <div><div class="stat-k">Real-time factor</div><div class="stat-v">${d.rtf ?? "–"}×</div></div>
      </div>` : ""}
    </div>

    ${rec.sample_rate && rec.sample_rate < 16000 ? `<div class="banner">
      ${rec.sample_rate / 1000} kHz narrowband telephony, upsampled to 16 kHz for the model.
      Accuracy will be well below the model's published 9.9% WER, which was measured on clean 16 kHz speech.
    </div>` : ""}

    ${d ? `<div class="card">
      <div class="t-head">
        <h2>Transcript</h2>
        <span class="lbl">${d.mode} · ${d.decoder.toUpperCase()}</span>
        <span class="spacer" style="flex:1"></span>
        <input id="find" type="search" placeholder="Highlight…" value="${esc(S.find)}">
        <button class="btn ghost" id="copy">Copy</button>
        <a class="btn ghost" href="/api/export/${encodeURIComponent(S.sel)}?mode=${S.mode}&decoder=${S.decoder}&fmt=txt">.txt</a>
        <a class="btn ghost" href="/api/export/${encodeURIComponent(S.sel)}?mode=${S.mode}&decoder=${S.decoder}&fmt=srt">.srt</a>
      </div>
      <div class="cues" id="cues"></div>
      <div class="note">Click any line to jump the audio there. Space plays or pauses, ← → seek 5s.</div>
    </div>` : `<div class="card"><div class="empty">
      Not transcribed yet with <b>${S.mode} / ${S.decoder.toUpperCase()}</b>.<br>
      Chunked + RNNT is the most accurate combination on telephony audio.
    </div></div>`}
  `;

  $("#play").onclick = toggle;
  $("#go").onclick = () => transcribe(!!d);
  $("#modeSeg").onclick = e => { const v = e.target.dataset.v; if (v) { S.mode = v; loadCached(); } };
  $("#decSeg").onclick = e => { const v = e.target.dataset.v; if (v) { S.decoder = v; loadCached(); } };
  $("#tl").onclick = e => {
    const b = e.currentTarget.getBoundingClientRect();
    if (dur) audio.currentTime = ((e.clientX - b.left) / b.width) * dur;
  };
  if (d) {
    $("#find").oninput = e => { S.find = e.target.value; paintCues(); };
    $("#copy").onclick = async e => {
      await navigator.clipboard.writeText(d.segments.map(s => s.text).join("\n"));
      e.target.textContent = "Copied"; setTimeout(() => e.target.textContent = "Copy", 1200);
    };
    drawTimeline(dur);
    paintCues();
  }
  tick();
}

const playIcon = () => audio.paused
  ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'
  : '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

function drawTimeline(dur) {
  if (!S.data?.speech || !dur) return;
  const tl = $("#tl"), head = $("#head");
  for (const [a, b] of S.data.speech) {
    const el = document.createElement("div");
    el.className = "tl-span";
    el.style.left = (a / dur * 100) + "%";
    el.style.width = Math.max(0.25, (b - a) / dur * 100) + "%";
    tl.insertBefore(el, head);
  }
}

function paintCues() {
  const box = $("#cues");
  if (!box || !S.data) return;
  const q = S.find.trim();
  box.innerHTML = "";
  S.cueEls = S.data.segments.map((s, i) => {
    const b = document.createElement("button");
    b.className = "cue";
    let body = esc(s.text);
    if (q) {
      const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
      const hit = re.test(s.text);
      body = body.replace(re, m => `<mark>${m}</mark>`);
      if (!hit) b.classList.add("dim");
    }
    b.innerHTML = `<span class="cue-t">${clock(s.start)}</span><span class="cue-x">${body}</span>`;
    b.onclick = () => { audio.currentTime = s.start; audio.play(); };
    box.appendChild(b);
    return b;
  });
  S.activeCue = -1;
}

/* ---------- playback ---------- */
function toggle() { audio.paused ? audio.play() : audio.pause(); }

function tick() {
  const cur = $("#cur"), head = $("#head");
  if (cur) cur.textContent = clock(audio.currentTime);
  const dur = S.data?.duration || audio.duration;
  if (head && dur) head.style.left = (audio.currentTime / dur * 100) + "%";

  if (S.data && S.cueEls.length) {
    const t = audio.currentTime;
    let idx = S.data.segments.findIndex(s => t >= s.start && t < s.end);
    if (idx !== S.activeCue) {
      if (S.cueEls[S.activeCue]) S.cueEls[S.activeCue].classList.remove("on");
      S.activeCue = idx;
      const el = S.cueEls[idx];
      if (el) {
        el.classList.add("on");
        const r = el.getBoundingClientRect();
        if (r.top < 70 || r.bottom > innerHeight - 20)
          el.scrollIntoView({ block: "center", behavior: "smooth" });
      }
    }
  }
}

audio.addEventListener("timeupdate", tick);
audio.addEventListener("loadedmetadata", () => render());
for (const ev of ["play", "pause"]) audio.addEventListener(ev, () => {
  const p = $("#play"); if (p) p.innerHTML = playIcon();
});

addEventListener("keydown", e => {
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.code === "Space") { e.preventDefault(); toggle(); }
  else if (e.key === "ArrowLeft") audio.currentTime -= 5;
  else if (e.key === "ArrowRight") audio.currentTime += 5;
});

/* ---------- boot ---------- */
loadRecordings();
pollStatus();
setInterval(pollStatus, 2500);
</script>
</body>
</html>
